<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
          content="Simulador Web de Fallos en Cascada basado en Teoría de Grafos — UAB" />
    <title>SimuladorCloud · Gestión Preventiva de Riesgos Cloud</title>

    <!-- Bootstrap 5 (copia local: el simulador funciona sin conexión — IT-8 · HU-15) -->
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css" />

    <!-- Estilos del simulador -->
    <link rel="stylesheet" href="css/simulator.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>" />

    <!-- Aplicación web progresiva (IT-8 · HU-15) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <meta name="theme-color" content="#0B1F4B" />

    <base href="/" />
</head>
<body>
    <!-- Contenedor raíz de Blazor -->
    <div id="app">
        <!-- Pantalla de carga mientras WASM inicializa -->
        <div style="
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0B1F4B;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        ">
            <div style="font-size: 3rem; margin-bottom: 16px;">⬡</div>
            <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 8px;">
                SimuladorCloud
            </div>
            <div style="font-size: 0.85rem; color: #8FB8D8; margin-bottom: 24px;">
                Cargando WebAssembly...
            </div>
            <div style="
                width: 200px; height: 4px;
                background: rgba(255,255,255,0.15);
                border-radius: 2px; overflow: hidden;
            ">
                <div style="
                    width: 40%; height: 100%;
                    background: #00A8CC;
                    border-radius: 2px;
                    animation: loading 1.2s ease-in-out infinite;
                "></div>
            </div>
            <style>
                @@keyframes loading {
                    0%   { margin-left: -40%; }
                    100% { margin-left: 100%; }
                }
            </style>
        </div>
    </div>

    <!-- Error de Blazor -->
    <div id="blazor-error-ui" style="display:none">
        <div style="
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #B91C1C; color: white;
            padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
        ">
            <span>⚠ Error al cargar el simulador. Recarga la página.</span>
            <button onclick="location.reload()"
                    style="background:white; color:#B91C1C;
                           border:none; padding:4px 12px; border-radius:4px;
                           cursor:pointer; font-weight:600;">
                Recargar
            </button>
        </div>
    </div>

    <!-- Bootstrap JS (copia local) -->
    <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Blazor WebAssembly runtime -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Service worker: funcionamiento sin conexión una vez cargada la aplicación (IT-8 · HU-15) -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
